version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint does not support TypeScript 7 yet. See docs/ITA.md section 3.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
